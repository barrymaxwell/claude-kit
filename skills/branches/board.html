<meta charset="utf-8">
<title>Branch Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: summary strip, then one card per repo; each branch is a row with a lane from main. */
:root {
  --bg: #F4F6F5; --surface: #FFFFFF; --fg: #18201F; --muted: #5A6664; --line: #D5DCDA; --accent: #1F6F68;
  --ok: #2E7D4F; --ok-bg: #E3F2E8; --warn: #9A6200; --warn-bg: #FBEFD9; --risk: #B3261E; --risk-bg: #FBE3E1;
  --info: #2F5FB3; --info-bg: #E2EBFA; --idle: #6A7774; --idle-bg: #ECEFEE; --clean: #6B4FA3; --clean-bg: #EEE8F7;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111615; --surface: #1A201F; --fg: #E4EBE9; --muted: #9AA8A5; --line: #2E3836; --accent: #5FC4B9;
  --ok: #6FD18F; --ok-bg: #1C3325; --warn: #F0B357; --warn-bg: #3A2C12; --risk: #FF8A80; --risk-bg: #3D1F1C;
  --info: #8AB4F8; --info-bg: #1D2A40; --idle: #9AA8A5; --idle-bg: #242B2A; --clean: #C3A8F0; --clean-bg: #2C2440; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111615; --surface: #1A201F; --fg: #E4EBE9; --muted: #9AA8A5; --line: #2E3836; --accent: #5FC4B9;
  --ok: #6FD18F; --ok-bg: #1C3325; --warn: #F0B357; --warn-bg: #3A2C12; --risk: #FF8A80; --risk-bg: #3D1F1C;
  --info: #8AB4F8; --info-bg: #1D2A40; --idle: #9AA8A5; --idle-bg: #242B2A; --clean: #C3A8F0; --clean-bg: #2C2440; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 36px 56px; }
main { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
h1 { font-size: 28px; line-height: 1.15; font-weight: 600; margin: 0; }
h2 { font-size: 16px; font-weight: 600; margin: 0; }
.stamp { font: 12px var(--mono); color: var(--muted); }
.summary { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font: 500 12px/1.4 var(--mono); white-space: nowrap; }
.chip b { font-weight: 600; font-variant-numeric: tabular-nums; }
.s-local { color: var(--risk); background: var(--risk-bg); }
.s-changes, .s-behind { color: var(--warn); background: var(--warn-bg); }
.s-merged { color: var(--clean); background: var(--clean-bg); }
.s-pr { color: var(--info); background: var(--info-bg); }
.s-empty { color: var(--idle); background: var(--idle-bg); }
.s-current, .s-pushed { color: var(--ok); background: var(--ok-bg); }
.repos { display: flex; flex-direction: column; gap: 16px; }
.repo { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.repo-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.group { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.path { font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.row { display: grid; grid-template-columns: 112px minmax(0, 1fr) 150px; gap: 6px 14px; align-items: center; padding-top: 10px; border-top: 1px solid var(--line); }
.row .name { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.branch { font: 500 13px var(--mono); overflow-wrap: anywhere; }
.meta { font-size: 12px; color: var(--muted); }
.meta a { color: var(--accent); }
.lane { display: block; width: 150px; height: 22px; }
.lane text { font: 500 10px var(--mono); fill: var(--muted); }
.quiet { font-size: 13px; color: var(--muted); }
.quiet code { font: 12px var(--mono); }
.empty-state { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
@media (max-width: 620px) {
  .row { grid-template-columns: 1fr; }
  .lane { width: 100%; max-width: 220px; }
}
</style>

<main>
  <header>
    <h1>Branch Board</h1>
    <span class="stamp" id="stamp">Waiting for data</span>
  </header>
  <div class="summary" id="summary"></div>
  <div class="legend">
    <span><span class="chip s-local">only on this Mac</span> back it up or push</span>
    <span><span class="chip s-merged">merged</span> safe to clean up</span>
    <span><span class="chip s-empty">empty</span> no commits yet</span>
  </div>
  <div class="repos" id="repos">
    <div class="empty-state">Repos appear here after <code>/branches</code> runs. Each one shows its worktrees, branches and pull requests.</div>
  </div>
  <p class="quiet" id="quiet"></p>
</main>

<script>
var LABEL = { local: "only on this Mac", changes: "uncommitted", behind: "behind", merged: "merged", pr: "PR open", empty: "empty", current: "current", pushed: "pushed" };
var ORDER = ["local", "changes", "behind", "merged", "pr", "empty", "pushed", "current"];
var STROKE = { local: "--risk", changes: "--warn", behind: "--warn", merged: "--clean", pr: "--info", empty: "--idle", current: "--ok", pushed: "--ok" };

function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function lane(r) {
  var ns = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 150 22"); svg.setAttribute("class", "lane"); svg.setAttribute("aria-hidden", "true");
  var c = "var(" + STROKE[r.status] + ")";
  function add(t, attrs) { var n = document.createElementNS(ns, t); for (var k in attrs) n.setAttribute(k, attrs[k]); svg.appendChild(n); return n; }
  add("line", { x1: 6, y1: 11, x2: 144, y2: 11, stroke: "var(--line)", "stroke-width": 2 });
  if (r.is_root) {
    add("circle", { cx: 75, cy: 11, r: 5, fill: c });
    if (r.behind) { var t = add("text", { x: 84, y: 8 }); t.textContent = r.behind + " behind"; }
    return svg;
  }
  add("circle", { cx: 6, cy: 11, r: 4, fill: "var(--muted)" });
  var t0 = add("text", { x: 14, y: 8 }); t0.textContent = "main";
  var w = Math.min(130, 30 + r.ahead * 12);
  add("line", { x1: 6, y1: 11, x2: 6 + w, y2: 11, stroke: c, "stroke-width": 2 });
  add("circle", { cx: 6 + w, cy: 11, r: 5, fill: r.status === "empty" ? "var(--surface)" : c, stroke: c, "stroke-width": 2 });
  if (r.ahead) { var t1 = add("text", { x: Math.max(14, w - 46), y: 21 }); t1.textContent = "+" + r.ahead + " commit" + (r.ahead > 1 ? "s" : ""); }
  return svg;
}

function render(data) {
  document.getElementById("stamp").textContent = "Updated " + new Date(data.generated).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) + (data.filter ? " \u00B7 " + data.filter : "");
  var counts = {};
  data.repos.forEach(function (repo) { repo.rows.forEach(function (r) { counts[r.status] = (counts[r.status] || 0) + 1; }); });
  var sum = document.getElementById("summary"); sum.textContent = "";
  ORDER.forEach(function (s) { if (!counts[s]) return; var c = el("span", "chip s-" + s); var b = el("b", null, counts[s]); c.appendChild(b); c.appendChild(document.createTextNode(" " + LABEL[s])); sum.appendChild(c); });

  var list = document.getElementById("repos"); list.textContent = "";
  var quiet = [];
  data.repos.forEach(function (repo) {
    if (!repo.attention) { quiet.push(repo.name); return; }
    var card = el("section", "repo");
    var head = el("div", "repo-head");
    head.appendChild(el("h2", null, repo.name));
    head.appendChild(el("span", "group", repo.group));
    card.appendChild(head);
    card.appendChild(el("div", "path", repo.path.replace(/^\/Users\/[^/]+/, "~")));
    var rows = repo.rows.slice().sort(function (a, b) { return (b.is_root - a.is_root) || (ORDER.indexOf(a.status) - ORDER.indexOf(b.status)); });
    rows.forEach(function (r) {
      var row = el("div", "row");
      var chip = el("span", "chip s-" + r.status, LABEL[r.status]);
      row.appendChild(chip);
      var name = el("div", "name");
      name.appendChild(el("span", "branch", r.branch));
      var bits = [r.is_root ? "root checkout" : (r.worktree ? "worktree " + r.worktree : "no worktree")];
      if (r.changes) bits.push(r.changes + " uncommitted");
      if (r.unpushed) bits.push(r.unpushed + " unpushed");
      if (r.date) bits.push("last commit " + r.date);
      var meta = el("span", "meta", bits.join(" \u00B7 "));
      if (r.pr) {
        meta.appendChild(document.createTextNode(" \u00B7 "));
        var a = el("a", null, "#" + r.pr.number + " " + r.pr.state.toLowerCase());
        a.href = r.pr.url; a.target = "_blank"; a.rel = "noopener";
        meta.appendChild(a);
      }
      name.appendChild(meta);
      row.appendChild(name);
      row.appendChild(lane(r));
      card.appendChild(row);
    });
    list.appendChild(card);
  });
  if (!list.children.length) list.appendChild(el("div", "empty-state", "Every repo is clean."));
  document.getElementById("quiet").textContent = quiet.length ? "Clean: " + quiet.join(", ") : "";
}

fetch("data.json", { cache: "no-store" })
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(function () { document.getElementById("stamp").textContent = "No data yet. Run /branches to fill this page."; });
</script>
